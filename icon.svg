<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="50%" stop-color="#6E40C9" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />
  <!-- Subtle border highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  <!-- Gemini Star Glow -->
  <path d="M64 24 C64 46, 46 64, 24 64 C46 64, 64 82, 64 104 C64 82, 82 64, 104 64 C82 64, 64 46, 64 24 Z" fill="white" opacity="0.3" filter="url(#glow)" />
  <!-- Main 4-pointed Gemini Star -->
  <path d="M64 28 C64 48, 48 64, 28 64 C48 64, 64 80, 64 100 C64 80, 80 64, 100 64 C80 64, 64 48, 64 28 Z" fill="url(#starGrad)" />
  <!-- Mini Accompanying Star -->
  <path d="M88 32 C88 38, 82 44, 76 44 C82 44, 88 50, 88 56 C88 50, 94 44, 100 44 C94 44, 88 38, 88 32 Z" fill="#FFFFFF" opacity="0.85" />
</svg>
